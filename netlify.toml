# Netlify configuration for birunibridge.com (static site, no build step)
#
# TEMPORARY MAINTENANCE. Production publishes only the maintenance/ folder.
# Language pages, assets, and the previous redirects stay in git history.
# To turn the site back on: restore this file from commit e912ef8
# (publish = "." plus the language redirects) and push to main.
[build]
  publish = "maintenance"
  command = ""

# --- Netlify default subdomain -> custom domain ---
[[redirects]]
  from = "https://birunibridge.netlify.app/*"
  to = "https://birunibridge.com/:splat"
  status = 301
  force = true

# --- www -> apex ---
[[redirects]]
  from = "https://www.birunibridge.com/*"
  to = "https://birunibridge.com/:splat"
  status = 301
  force = true

# Any path that is not a file in maintenance/ shows the closed page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
